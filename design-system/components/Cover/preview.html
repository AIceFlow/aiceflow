<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>AIceFlow</title>
<style>
html,body{margin:0;height:100%} body{background:var(--paper);overflow:hidden}
.cover{position:relative;width:960px;height:288px;overflow:hidden}
.top{position:absolute;left:0;top:0;width:960px;height:192px;background:var(--ink)}
.words{position:absolute;left:var(--space-8);top:var(--space-8);max-width:440px}
.words .af-marker{color:var(--on-ink-muted)} .words .af-marker__no{color:var(--on-ink)}
.name{margin:var(--space-3) 0 0;font-family:var(--font-display);font-weight:400;font-size:64px;line-height:64px;letter-spacing:-.025em;color:var(--on-ink)}
.tr{position:absolute;left:520px;top:48px;width:400px}
.tr .af-trace__row{padding:10px 14px} .tr .af-trace__text{font-size:13px;line-height:18px}
.sig{position:absolute;left:var(--space-8);bottom:var(--space-6);height:40px}
</style></head>
<body><div class="cover"><div class="top"></div>
<div class="words"><p class="af-marker"><span class="af-marker__no">01</span> Brand Guideline</p><h1 class="name">Ruhig, genau, nachvollziehbar.</h1></div>
<div class="tr"><ol class="af-trace">
<li class="af-trace__row"><time class="af-trace__time">09:14:02</time><span><span class="af-trace__actor">Rechnungs-Agent</span><span class="af-trace__text">Rechnung 2026-1042 gelesen.</span></span><span class="af-status"><i class="af-status__mark"></i>Durchgelassen</span></li>
<li class="af-trace__row af-trace__row--held"><time class="af-trace__time">09:14:03</time><span><span class="af-trace__actor">Gateway</span><span class="af-trace__text">Betrag über 10.000 €.</span></span><span class="af-status af-status--held"><i class="af-status__mark"></i>Angehalten</span></li>
<li class="af-trace__row"><time class="af-trace__time">09:21:40</time><span><span class="af-trace__actor">M. Berger</span><span class="af-trace__text">Zahlung freigegeben.</span></span><span class="af-status af-status--approved"><i class="af-status__mark"></i>Freigegeben</span></li>
</ol></div>
<img class="sig" src="/logos/aiceflow-horizontal.svg" alt="AIceFlow">
</div></body></html>
